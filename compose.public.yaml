services:
  coverstead:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      ENV_FILE: /app/data/config.env
    volumes:
      - coverstead-data:/app/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  coverstead-data:
  caddy-data:
  caddy-config:
