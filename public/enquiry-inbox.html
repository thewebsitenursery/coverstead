<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private enquiries · Coverstead</title><link rel="stylesheet" href="/enquiry-inbox.css"><script src="/enquiry-inbox.js" defer></script></head>
<body><header><a href="/">Coverstead</a><a href="/admin">Staff area</a></header><main class="inbox"><p class="eyebrow">PRODUCT OWNER</p><h1>Private enquiries</h1><p>Visitor messages stay here. Email alerts contain a sign-in link and the sender’s reply address.</p><p id="inbox-error" role="alert"></p>
<form id="inbox-login"><h2>Sign in</h2><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in to enquiries</button></form>
<section id="inbox-content" hidden><div class="actions"><button id="inbox-refresh">Refresh</button><button id="inbox-logout">Sign out</button></div><p>Enquiries are removed 90 days after submission. Review new messages within two working days.</p><div id="inbox-records"></div></section></main></body></html>
