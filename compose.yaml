services:
  coverstead:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      ENV_FILE: /app/data/config.env
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - coverstead-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/platform').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  coverstead-data:
