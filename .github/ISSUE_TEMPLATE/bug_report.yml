name: Bug report
description: Report a reproducible problem using synthetic venue data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the repository's private security reporting form. Do not include guest details, credentials or configuration files."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What were you trying to do, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest example with synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: "0.1.0, Node 24, macOS or Docker, browser/version"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove personal details, secrets and installation tokens first.
